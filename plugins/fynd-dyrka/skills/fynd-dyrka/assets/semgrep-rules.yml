# fynd-dyrka custom semgrep rules.
#
# WHY separate from --config auto: measurement showed auto catches only eval
# and CI injection out of this set, missing 5 classes common to the Next.js/TS
# stack (DOM XSS, NEXT_PUBLIC_ leakage, SQL concatenation in a route,
# $queryRawUnsafe). These rules do not duplicate auto — they close its gaps.
#
# Wired in as a second pass: semgrep scan --config <this file>. Findings go
# into the same sast layer. The rules are deliberately narrow and
# high-precision — better to miss one than to flood the report with false
# positives (triage costs more than a miss here).
#
# IMPORTANT (YAML): quote any pattern containing ": ", otherwise YAML reads
# the colon as a mapping and the validator fails.

rules:
  # --- DOM XSS sinks -------------------------------------------------------
  - id: fd-react-dangerously-set-innerhtml
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      dangerouslySetInnerHTML with unchecked input gives DOM XSS. Make sure
      __html is sanitised (DOMPurify) or the value is entirely static.
    metadata:
      cwe: "CWE-79 Cross-site Scripting"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern: "<$EL ... dangerouslySetInnerHTML={{__html: $X}} ... />"
      - pattern-not: "<$EL ... dangerouslySetInnerHTML={{__html: \"...\"}} ... />"
      - pattern-not: "<$EL ... dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} ... />"

  - id: fd-dom-innerhtml-assignment
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Assigning to .innerHTML/.outerHTML is DOM XSS when the right-hand side
      carries user input. Use textContent, or sanitise.
    metadata:
      cwe: "CWE-79"
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.innerHTML = ""

  # --- Secrets that ship to the client -------------------------------------
  - id: fd-next-public-secret-name
    languages: [generic]
    severity: ERROR
    message: >-
      A variable prefixed NEXT_PUBLIC_ (or VITE_/REACT_APP_/PUBLIC_) is
      compiled into the browser bundle. If the name contains
      secret/key/token/password, the secret ships to the client. Keep secrets in
      server-side env vars with no public prefix.
    metadata:
      cwe: "CWE-200 Exposure of Sensitive Information"
    paths:
      include:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.env*"
    patterns:
      - pattern-regex: "(NEXT_PUBLIC_|VITE_|REACT_APP_|PUBLIC_)[A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|TOKEN|API_?KEY|CREDENTIAL)"

  # --- SQL injection: concatenation / raw -----------------------------------
  - id: fd-prisma-raw-unsafe-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      $queryRawUnsafe/$executeRawUnsafe with string interpolation gives SQLi.
      Use $queryRaw with a tagged template (Prisma parameterises it), or pass
      values as the second argument.
    metadata:
      cwe: "CWE-89 SQL Injection"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: "$P.$queryRawUnsafe(`...${$X}...`)"
          - pattern: "$P.$executeRawUnsafe(`...${$X}...`)"
          - pattern: "$P.$queryRawUnsafe($A + $B)"
          - pattern: "$P.$executeRawUnsafe($A + $B)"

  - id: fd-sql-template-concatenation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      The SQL query is built from a template string with an interpolated
      variable — SQL injection is possible. Parameterise it ($1/$2 plus an
      argument array).
    metadata:
      cwe: "CWE-89"
    patterns:
      - pattern-either:
          - pattern: "$DB.query(`...${$X}...`)"
          - pattern: "$DB.execute(`...${$X}...`)"
          - pattern: "$DB.raw(`...${$X}...`)"

  # --- Weak secret comparison (fail-open / timing) -------------------------
  - id: fd-secret-compared-with-loose-equality
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Comparing a secret, token or signature with ==/=== instead of
      crypto.timingSafeEqual enables a timing attack and risks a fail-open on an
      empty value. Compare in constant time.
    metadata:
      cwe: "CWE-208 Observable Timing Discrepancy"
    patterns:
      - pattern-either:
          - pattern: $SECRET === $INPUT
          - pattern: $INPUT === $SECRET
          - pattern: $SECRET == $INPUT
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(secret|token|signature|hmac|apikey|api_key|password|webhook).*

  # --- CI / supply chain ----------------------------------------------------
  - id: fd-gha-pull-request-target-checkout
    languages: [yaml]
    severity: ERROR
    message: >-
      pull_request_target runs with the repository's secrets and write access,
      while actions/checkout with a ref from the PR pulls untrusted fork code —
      the classic pwn-request (secret theft, writes to the repo). Do not check
      out PR code under pull_request_target, or isolate it strictly with no
      secrets.
    metadata:
      cwe: "CWE-829 Inclusion of Functionality from Untrusted Control Sphere"
    patterns:
      - pattern-regex: "pull_request_target"
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"

  - id: fd-gha-untrusted-input-in-run
    languages: [yaml]
    severity: ERROR
    message: >-
      Untrusted PR input (title/body/branch/author) is interpolated straight
      into the run: shell script — command injection on the runner. Pass it
      through an env variable rather than ${{ }} inside run.
    metadata:
      cwe: "CWE-78 OS Command Injection"
    patterns:
      - pattern-regex: >-
          \$\{\{\s*github\.event\.(pull_request\.(title|body|head\.ref|head\.label)|issue\.(title|body)|comment\.body|review\.body)\s*\}\}
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"

  - id: fd-dotenv-committed
    languages: [generic]
    severity: WARNING
    message: >-
      This looks like a committed .env holding a real value. .env should not be
      tracked by git — move it to .env.example with placeholder values and add
      .env* to .gitignore. If the value is live, revoke it.
    metadata:
      cwe: "CWE-538 Insertion of Sensitive Information into Externally-Accessible File"
    paths:
      include:
        - "*.env"
        - ".env"
        - ".env.*"
      exclude:
        - "*.env.example"
        - "*.env.sample"
        - "*.env.template"
    patterns:
      - pattern-regex: "^[A-Z][A-Z0-9_]*=.+"

  # --- Injection: sinks that auto misses or sees only partially -------------
  - id: fd-python-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess with shell=True is RCE if any part of the command comes from
      outside. Pass an argument list without shell=True; user values go only as
      separate list elements, with "--" before them.
    metadata:
      cwe: "CWE-78 OS Command Injection"
      owasp: "A03:2021 Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
      # A full literal means the command is fixed, with nothing to inject.
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...")

  - id: fd-node-child-process-exec
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      child_process.exec/execSync runs through a shell — concatenating input
      gives RCE. Use execFile/spawn with an argument list.
    metadata:
      cwe: "CWE-78"
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
          - pattern: child_process.execSync($CMD, ...)
      - pattern-not: exec("...", ...)
      - pattern-not: execSync("...", ...)
      - pattern-not: child_process.exec("...", ...)
      - pattern-not: child_process.execSync("...", ...)

  - id: fd-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Deserialising untrusted data means executing code. pickle/marshal have
      no safe mode — change the format (JSON). For YAML, use yaml.safe_load.
    metadata:
      cwe: "CWE-502 Deserialization of Untrusted Data"
      owasp: "A08:2021 Software and Data Integrity Failures"
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: marshal.loads(...)
          - pattern: yaml.load($X)
          - pattern: yaml.load($X, Loader=yaml.Loader)
          - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
          - pattern: yaml.unsafe_load(...)

  - id: fd-ssti-template-from-string
    languages: [python]
    severity: ERROR
    message: >-
      User input in the template BODY (not in its data) is SSTI and usually
      RCE. The template must be static; pass input as a render parameter.
    metadata:
      cwe: "CWE-1336 Server-Side Template Injection"
    patterns:
      - pattern-either:
          - pattern: render_template_string($T, ...)
          - pattern: jinja2.Template($T).render(...)
          - pattern: Template($T).render(...)
      - pattern-not: render_template_string("...", ...)
      - pattern-not: jinja2.Template("...").render(...)
      - pattern-not: Template("...").render(...)

  - id: fd-vue-v-html
    languages: [generic]
    severity: WARNING
    message: >-
      v-html renders a string as HTML — XSS when the value comes from a user.
      Use {{ }} interpolation, or sanitise.
    metadata:
      cwe: "CWE-79"
    paths:
      include:
        - "*.vue"
        - "*.html"
    patterns:
      - pattern-regex: "v-html\\s*="

  - id: fd-express-redirect-user-input
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Redirecting to a value from the request is an open redirect (phishing,
      token theft from an OAuth flow). Check the destination against an
      allowlist, not against "starts with /".
    metadata:
      cwe: "CWE-601 URL Redirection to Untrusted Site"
    patterns:
      - pattern-either:
          - pattern: $RES.redirect(req.query.$P, ...)
          - pattern: $RES.redirect(req.body.$P, ...)
          - pattern: $RES.redirect(req.params.$P, ...)

  # --- Availability and cost ------------------------------------------------
  - id: fd-python-request-without-timeout
    languages: [python]
    severity: WARNING
    message: >-
      An outbound request with no timeout hangs indefinitely — workers and the
      connection pool drain and the service stalls. Always set timeout=.
    metadata:
      cwe: "CWE-400 Uncontrolled Resource Consumption"
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: requests.put(...)
          - pattern: requests.delete(...)
          - pattern: requests.patch(...)
          - pattern: requests.head(...)
          - pattern: requests.request(...)
          - pattern: httpx.get(...)
          - pattern: httpx.post(...)
      - pattern-not: requests.$M(..., timeout=$T, ...)
      - pattern-not: httpx.$M(..., timeout=$T, ...)

  - id: fd-redos-nested-quantifier
    languages: [generic]
    severity: WARNING
    message: >-
      A nested quantifier in a regex means catastrophic backtracking (ReDoS).
      If the string comes from a user, one request hangs a thread. Confirm by
      measuring with a killer string; the JS/Python/Java engines are vulnerable.
    metadata:
      cwe: "CWE-1333 Inefficient Regular Expression Complexity"
    paths:
      include:
        - "*.py"
        - "*.js"
        - "*.ts"
        - "*.jsx"
        - "*.tsx"
        - "*.java"
        - "*.php"
        - "*.rb"
    patterns:
      # (a+)+ / (a*)* / (\d+)* and algebraically equivalent forms
      - pattern-regex: "\\([^()\\n]*[+*]\\)\\s*[+*]"

  - id: fd-sql-select-without-limit
    languages: [generic]
    severity: INFO
    message: >-
      SELECT with no LIMIT on a growing table pulls everything into memory in
      one query. Add pagination with a server-side UPPER bound.
    metadata:
      cwe: "CWE-770 Allocation of Resources Without Limits or Throttling"
    paths:
      include:
        - "*.py"
        - "*.js"
        - "*.ts"
        - "*.sql"
    patterns:
      - pattern-regex: "(?i)SELECT\\s+\\*\\s+FROM\\s+[a-z_][a-z0-9_]*\\s*(?:;|[\"'`])"

  - id: fd-client-controlled-limit
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The result limit comes from the request with no upper bound — a client
      sends limit=999999 and drains the database. Wrap it in Math.min(x, MAX).
    metadata:
      cwe: "CWE-770"
    patterns:
      - pattern-either:
          - pattern: "{..., take: Number(req.query.$P), ...}"
          - pattern: "{..., take: parseInt(req.query.$P), ...}"
          - pattern: "{..., limit: Number(req.query.$P), ...}"
          - pattern: "{..., limit: parseInt(req.query.$P), ...}"

  # --- LLM: user input in the prompt ----------------------------------------
  - id: fd-llm-user-input-in-system-prompt
    languages: [python]
    severity: WARNING
    message: >-
      User text concatenated into the SYSTEM prompt is direct prompt
      injection: the user's instructions become indistinguishable from yours.
      Keep user content in a separate user message and limit the model's
      authority (tools, side effects) rather than filtering the prompt.
    metadata:
      cwe: "CWE-77 Command Injection"
      owasp: "LLM01:2025 Prompt Injection"
    patterns:
      - pattern-either:
          - pattern: |
              {..., "role": "system", "content": f"...", ...}
          - pattern: |
              {..., "role": "system", "content": "..." + $X, ...}
          - pattern: |
              {..., "role": "system", "content": "...".format(...), ...}
